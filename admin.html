<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>站点管理｜神州</title>
  <meta name="theme-color" content="#0f1310" />
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/admin.css" />
</head>
<body class="admin-body">
  <header class="admin-topbar">
    <a class="brand brand--admin" href="index.html" aria-label="神州站点首页">
      <span class="brand-mark brand-mark--small" aria-hidden="true">
        <svg viewBox="0 0 44 44" focusable="false">
          <path d="M22 2.5 40 12.8 22 23.1 4 12.8Z" fill="#f0a24a"/>
          <path d="M4 12.8 22 23.1 22 41.5 4 31.2Z" fill="#9a5d32"/>
          <path d="M40 12.8 22 23.1 22 41.5 40 31.2Z" fill="#6d4026"/>
          <path d="M15.5 19.3 21 22.4 26.5 19.3 26.5 25.3 21 28.3 15.5 25.3Z" fill="#f6e7ca" opacity=".9"/>
        </svg>
      </span>
      <span class="brand-copy"><strong>神州</strong><small>CONTENT STUDIO</small></span>
    </a>
    <div class="admin-topbar__status">
      <span id="admin-connection" class="admin-connection" hidden><span class="admin-connection__dot"></span><span id="admin-connection-text">未连接</span></span>
    </div>
    <div class="admin-topbar__actions">
      <a class="admin-top-link" href="index.html" target="_blank" rel="noopener">查看站点 <span aria-hidden="true">↗</span></a>
      <button class="admin-top-link" id="admin-logout" type="button" hidden>退出</button>
    </div>
  </header>

  <main id="admin-app" tabindex="-1">
    <div class="admin-loading" role="status" aria-live="polite">
      <div class="admin-loading__bar"><span></span></div>
      <p>正在准备内容工作台…</p>
    </div>
  </main>

  <div id="admin-toast" class="admin-toast" role="status" aria-live="polite"></div>

  <noscript>
    <div class="noscript">内容工作台需要 JavaScript。请启用后刷新。</div>
  </noscript>

  <script type="module" src="assets/js/admin.js"></script>
</body>
</html>
